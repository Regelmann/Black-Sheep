name: ETL diario

# Automatiza scripts/KEYFOODS_CICLO_UNICO.py (hoy corre a mano en Colab).
#
# COMPUERTA VALIDAR/PUBLICAR (obligatoria — ver README.md > ETL):
#   1) "Validar" corre el ciclo completo con KF_SKIP_SUPABASE=1: descarga
#      los Excel, calcula todo, pero NO escribe en Supabase. Si algo no
#      cuadra, el script termina con SystemExit != 0 y GitHub Actions
#      marca el paso como fallido.
#   2) "Publicar" sólo se ejecuta si el paso anterior fue exitoso — es
#      la misma garantía que pide el README, aplicada a nivel de job:
#      un paso fallido detiene los pasos siguientes por defecto.
#
# Horario sugerido: 6:00 AM hora de Chile, días hábiles, antes de que
# los vendedores arranquen su ruta. Chile cambia de huso con el horario
# de verano (UTC-3 / UTC-4) y cron de GitHub Actions es siempre UTC, así
# que este horario puede correrse ±1 hora según la época del año —
# ajustar el cron si hace falta más precisión.

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 09:00 UTC = 06:00 Chile (UTC-3, horario de verano)
  workflow_dispatch:
    inputs:
      solo_validar:
        description: 'Correr sólo VALIDAR (no escribe en Supabase)'
        type: boolean
        default: false

concurrency:
  group: etl-ciclo-unico
  cancel-in-progress: false   # nunca cortar una carga a mitad de camino

jobs:
  etl:
    name: Descargar · Validar · Publicar
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy openpyxl requests supabase \
                      google-auth google-api-python-client

      # 1. Descarga los Excel (ventas, maestra, stock, precios, config)
      #    desde la carpeta de Google Drive hacia ./data
      - name: Descargar Excel desde Drive
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          KF_DATA_DIR: data
        run: python scripts/descargar_excel_drive.py

      # 2. VALIDAR — corre todo el ciclo SIN tocar Supabase.
      #    KF_SKIP_SUPABASE=1 es la compuerta: si el cálculo o la
      #    integridad de los datos falla, el script sale con código
      #    distinto de cero y este paso (y el job) se marca en rojo.
      - name: Validar (sin escribir en Supabase)
        env:
          KF_DATA_DIR: data
          KF_SKIP_SUPABASE: '1'
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/KEYFOODS_CICLO_UNICO.py

      # 3. PUBLICAR — sólo se llega acá si "Validar" terminó OK.
      #    Se puede forzar a NO publicar desde un run manual
      #    (workflow_dispatch → solo_validar = true) para probar sin
      #    riesgo antes de dejarlo en automático.
      - name: Publicar en Supabase
        if: ${{ github.event.inputs.solo_validar != 'true' }}
        env:
          KF_DATA_DIR: data
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: python scripts/KEYFOODS_CICLO_UNICO.py

      # Si algo falló arriba, que quede un aviso explícito en el
      # resumen del run — no sólo el X rojo genérico de GitHub.
      - name: Aviso si falló
        if: failure()
        run: |
          echo "### ⚠️ El ETL falló — revisar el log del paso que quedó en rojo." >> "$GITHUB_STEP_SUMMARY"
          echo "Ningún dato se publicó si falló Validar (la compuerta funcionó)." >> "$GITHUB_STEP_SUMMARY"
