name: CI

# Existe porque tres entregas seguidas llegaron sin compilar:
#   V9.0   → Visita.jsx con JSX inválido
#   V92.4  → importaba CatalogoCliente.jsx después de borrarlo
# Ninguna había corrido `npm run build` antes de subir.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Guard · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/field

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/field/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # 1. Análisis estático — detecta bugs que TODAVÍA no ocurrieron.
      #    guard.js es retrospectivo; ESLint es preventivo. Se necesitan
      #    los dos: un `data` sin declarar no lo ve ninguna regla del guard.
      - name: Lint
        run: npm run lint

      # 2. Reglas de regresión — cada una nació de un bug real en producción
      - name: Guard (regresiones conocidas)
        run: npm run guard

      # 2. Tests unitarios
      - name: Tests
        run: npm test

      # 3. Build — el paso que faltaba
      - name: Build
        run: |
          # Vite avisa "Circular chunk: A -> B -> A" como WARNING. Ese aviso
          # precede a un TypeError de createContext en producción → pantalla
          # en blanco. Acá se trata como error.
          npm run build 2>&1 | tee /tmp/build.log
          if grep -q "Circular chunk" /tmp/build.log; then
            echo "::error::Vite reportó un chunk circular. Agrupá el paquete con vendor-react."
            grep "Circular chunk" /tmp/build.log
            exit 1
          fi

      # 4. El stamp tiene que estar y ser único
      - name: Verificar BUILD_STAMP
        run: |
          # El stamp vive en lib/buildStamp.js desde V10.2 — se movió para
          # romper el ciclo App → ErrorBoundary → App. El CI seguía
          # buscándolo en App.jsx y fallaba con exit 1.
          STAMP_FILE=src/lib/buildStamp.js
          STAMP=$(grep -oP "BUILD_STAMP = '\K[^']+" "$STAMP_FILE" || true)
          if [ -z "$STAMP" ]; then
            echo "::error::No se encontró BUILD_STAMP en $STAMP_FILE"
            exit 1
          fi
          # Fuente ÚNICA: nadie más puede declararlo.
          N=$(grep -rl "export const BUILD_STAMP" src | wc -l)
          if [ "$N" -ne 1 ]; then
            echo "::error::BUILD_STAMP declarado en $N archivos (debe ser 1)"
            grep -rn "export const BUILD_STAMP" src
            exit 1
          fi
          echo "✅ BUILD_STAMP = $STAMP"
          echo "### 📦 \`$STAMP\`" >> $GITHUB_STEP_SUMMARY

      # 5. Presupuesto de tamaño — hoy avisa, en Fase 3 bloquea
      - name: Presupuesto de bundle
        run: |
          # Se mide el chunk de la APP (index-*), no el mayor de todos.
          # Los vendors son grandes pero se cachean entre deploys: lo que
          # el vendedor vuelve a bajar en cada release es sólo la app.
          APP=$(find dist/assets -name 'index-*.js' ! -name '*.map' -printf '%s\n' | sort -rn | head -1)
          KB=$((APP / 1024))
          TOTAL=$(find dist/assets -name '*.js' ! -name '*.map' -printf '%s\n' | awk '{s+=$1} END {print int(s/1024)}')

          echo "### 📦 Bundle" >> $GITHUB_STEP_SUMMARY
          echo "| Chunk | Tamaño |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| App (se rebaja en cada deploy) | ${KB} kB |" >> $GITHUB_STEP_SUMMARY
          echo "| Total inicial | ${TOTAL} kB |" >> $GITHUB_STEP_SUMMARY
          find dist/assets -name '*.js' ! -name '*.map' -printf '%f %s\n' \
            | sort -k2 -rn | head -8 \
            | awk '{printf "| %s | %.1f kB |\n", $1, $2/1024}' >> $GITHUB_STEP_SUMMARY

          if [ "$KB" -gt 350 ]; then
            echo "::error::Chunk de app ${KB} kB supera el techo de 350 kB. Revisar imports."
            exit 1
          elif [ "$KB" -gt 250 ]; then
            echo "::warning::Chunk de app ${KB} kB — objetivo < 250 kB"
          else
            echo "✅ Chunk de app ${KB} kB (objetivo < 250 kB)"
          fi

          # El code-splitting no debe deshacerse por accidente.
          N=$(find dist/assets -name '*.js' ! -name '*.map' | wc -l)
          if [ "$N" -lt 4 ]; then
            echo "::error::Sólo ${N} chunks — el code-splitting se rompió."
            exit 1
          fi

      - name: Guardar dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: apps/field/dist
          retention-days: 7
