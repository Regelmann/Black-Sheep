<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingresar — Black Sheep Field</title>
  <meta name="description" content="Acceso a Black Sheep Field. Elegí tu empresa y entrá a la app." />
  <link rel="icon" type="image/png" href="brand/logo-mark-32.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* Login page — centrado perfecto */
    .login-body {
      min-height: 100dvh;
      margin: 0;
      background: #050505;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
    }
    .login-page {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    .login-card {
      width: 100%;
      padding: 36px 24px;
      border-radius: 24px;
      background: #141414;
      border: 1px solid rgba(163, 230, 53, 0.22);
      box-shadow: 0 0 60px rgba(163, 230, 53, 0.08), 0 24px 60px rgba(0,0,0,.5);
      text-align: center;
      box-sizing: border-box;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: 0 auto 18px;
    }
    .logo-wrap img {
      display: block;
      width: 88px;
      height: 88px;
      margin: 0 auto;
      border-radius: 18px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(163, 230, 53, 0.45));
    }
    .login-card h1 {
      margin: 0 0 6px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f2f2f2;
    }
    .login-card h1 .neon-text { color: #a3e635; }
    .login-card .sub {
      margin: 0 0 22px;
      color: #888;
      font-size: 0.9rem;
    }
    .field { text-align: left; margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 6px;
    }
    .field input, .field select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #2a2a2a;
      background: #0a0a0a;
      color: #f2f2f2;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
      -webkit-appearance: none;
    }
    .field input:focus, .field select:focus {
      border-color: rgba(163, 230, 53, 0.55);
      box-shadow: 0 0 0 3px rgba(163, 230, 53, 0.12);
    }
    .btn-neon {
      display: flex;
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      border: none;
      border-radius: 99px;
      background: #a3e635;
      color: #080808;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      justify-content: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-neon:hover { background: #b8f04a; }
    .login-note {
      margin-top: 18px;
      padding: 12px;
      border-radius: 12px;
      background: rgba(163, 230, 53, 0.08);
      border: 1px solid rgba(163, 230, 53, 0.18);
      font-size: 12px;
      color: #aaa;
      text-align: left;
      line-height: 1.45;
    }
    .login-foot {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
    }
    .login-foot a { color: #a3e635; text-decoration: none; }
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
      padding: 10px 16px;
      border-radius: 99px;
      background: #25D366;
      color: #fff !important;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-page">
    <div class="login-card">
      <div class="logo-wrap">
        <img src="brand/logo-mark-192.png" alt="Black Sheep" width="88" height="88" />
      </div>
      <h1>Black Sheep <span class="neon-text">Field</span></h1>
      <p class="sub">Elegí tu empresa y continuá a la app</p>

      <form id="login-form" action="#" method="post">
        <div class="field">
          <label for="tenant">Empresa</label>
          <select id="tenant" name="tenant" required>
            <option value="keyfoods">KeyFoods</option>
            <option value="demo">Demo Black Sheep</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username"
                 placeholder="tu@empresa.cl" required />
        </div>
        <button class="btn-neon" type="submit">Continuar a la app →</button>
      </form>

      <div class="login-note">
        <strong style="color:#f4f4f5">black-sheep.cl</strong> es la puerta de entrada.
        La contraseña la ingresás en la app Field de tu empresa.
      </div>

      <a class="wa-btn" href="https://wa.me/56932188569?text=Hola%20Black%20Sheep%20Field%2C%20quiero%20información"
         target="_blank" rel="noopener">WhatsApp</a>

      <p class="login-foot">
        <a href="/">← Volver al sitio</a>
        · <a href="mailto:hola@black-sheep.cl">Email</a>
      </p>
    </div>
  </div>

  <script>
    window.BS_APP_URL = window.BS_APP_URL || 'https://app.black-sheep.cl';

    const emailEl = document.getElementById('email');
    const tenantEl = document.getElementById('tenant');

    function hintTenant(email) {
      const e = (email || '').toLowerCase();
      if (e.includes('keyfoods')) tenantEl.value = 'keyfoods';
      else if (e.includes('demo') || e.includes('blacksheep') || e.includes('black-sheep')) tenantEl.value = 'demo';
    }
    emailEl.addEventListener('input', function () { hintTenant(emailEl.value); });

    try {
      const q = new URLSearchParams(location.search);
      if (q.get('email')) emailEl.value = q.get('email');
      if (q.get('tenant')) tenantEl.value = q.get('tenant');
    } catch (_) {}

    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = emailEl.value.trim();
      const tenant = tenantEl.value || 'keyfoods';
      if (!email) return;
      const base = (window.BS_APP_URL || '').trim().replace(/\/$/, '');
      if (!base) { alert('Falta BS_APP_URL'); return; }
      try {
        const url = new URL(base + '/');
        url.searchParams.set('email', email);
        url.searchParams.set('tenant', tenant);
        window.location.href = url.toString();
      } catch (err) {
        window.location.href = base + '/?email=' + encodeURIComponent(email) + '&tenant=' + encodeURIComponent(tenant);
      }
    });
  </script>
</body>
</html>
