  <body>
    <div id="root"></div>

    <!-- ══════════════════════════════════════════════════════════════
         GUARDIA DE ARRANQUE

         Si el JS falla ANTES de que React monte, el ErrorBoundary no
         existe todavía: el vendedor ve una pantalla en blanco y no
         tiene forma de saber si es la app, la señal o su teléfono.

         Este bloque es JS clásico (no módulo): corre aunque el bundle
         no cargue. Si a los 8 segundos #root sigue vacío, muestra una
         pantalla con salida y el error real.

         No arregla la causa. Impide que la causa sea invisible.
         ══════════════════════════════════════════════════════════════ -->
    <script>
      (function () {
        var fallo = null
        window.addEventListener('error', function (e) {
          fallo = fallo || (e.message + (e.filename ? ' · ' + e.filename.split('/').pop() : ''))
        })
        window.addEventListener('unhandledrejection', function (e) {
          fallo = fallo || ('promesa: ' + (e.reason && e.reason.message ? e.reason.message : e.reason))
        })

        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && root.children.length > 0) return   // React montó: todo bien

          var cola = 0
          try {
            var q = JSON.parse(localStorage.getItem('kf_action_queue_v1') || '[]')
            cola = Array.isArray(q) ? q.length : 0
          } catch (_) {}

          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;padding:28px 20px;max-width:440px;margin:0 auto;text-align:center">' +
              '<h1 style="font-size:20px;font-weight:800;margin:36px 0 8px;color:#1c1917">La app no pudo abrir</h1>' +
              '<p style="font-size:14px;color:#78716c;line-height:1.5;margin:0 0 16px">' +
                'No es tu teléfono. Probá recargar; si sigue igual, avisá a soporte.' +
              '</p>' +
              (cola > 0
                ? '<p style="font-size:13px;font-weight:600;background:#d1fae5;color:#166534;padding:12px;border-radius:12px;margin:0 0 16px;line-height:1.45">' +
                  'Tenés <b>' + cola + '</b> ' + (cola === 1 ? 'acción guardada' : 'acciones guardadas') +
                  ' en el teléfono. <b>No se perdieron.</b></p>'
                : '') +
              '<button onclick="location.reload()" style="width:100%;min-height:52px;border:0;border-radius:13px;background:#c2410c;color:#fff;font-size:15px;font-weight:800;cursor:pointer">Recargar</button>' +
              '<button onclick="if(window.caches){caches.keys().then(function(k){return Promise.all(k.map(function(n){return caches.delete(n)}))}).then(function(){location.reload(true)})}else{location.reload(true)}" ' +
                'style="width:100%;min-height:48px;margin-top:8px;border:1.5px solid #d6cfc4;border-radius:12px;background:transparent;color:#44403c;font-size:14px;font-weight:700;cursor:pointer">' +
                'Limpiar caché y recargar</button>' +
              (fallo
                ? '<p style="margin-top:20px;font-size:11px;color:#b91c1c;word-break:break-word;text-align:left;background:#fef2f2;padding:10px;border-radius:10px">' + fallo + '</p>'
                : '') +
            '</div>'
        }, 8000)
      })()
    </script>

  </body>
